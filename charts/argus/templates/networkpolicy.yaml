{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if or (eq (len $np.apiPeers) 0) (eq (len $np.ingressFrom) 0) }}
{{- fail "networkPolicy.apiPeers and ingressFrom must identify API peers and API clients" }}
{{- end }}
{{- $ssh := list }}
{{- if .Values.checks.hosts.enabled }}
{{- range .Values.checks.hosts.hosts }}
{{- $match := regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+(:[0-9]+)?$" .address }}
{{- if $match }}
{{- $parts := splitList ":" .address }}
{{- $port := 22 }}
{{- if eq (len $parts) 2 }}{{ $port = index $parts 1 | atoi }}{{ end }}
{{- $ssh = append $ssh (dict "cidr" (printf "%s/32" (index $parts 0)) "port" $port) }}
{{- else if not $np.sshPeers }}
{{- fail (printf "networkPolicy.sshPeers must cover host %s, whose address is not an IPv4 literal" .name) }}
{{- end }}
{{- end }}
{{- end }}
{{- $ssh = concat $ssh $np.sshPeers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml $np.ingressFrom | nindent 8 }}
      ports:
        - {port: 8443, protocol: TCP}
  egress:
    - to:
        {{- range $np.apiPeers }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range $np.apiPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- if $np.dns.enabled }}
    - to:
        {{- toYaml $np.dns.peers | nindent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- end }}
    {{- range $ssh }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        - {port: {{ .port }}, protocol: TCP}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
