apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
data:
  config.json: |
    {{- include "argus.config" . | nindent 4 }}
  {{- if .Values.checks.hosts.enabled }}
  known_hosts: |
    {{- required "ssh.knownHosts must hold the reviewed known_hosts when checks.hosts is enabled" .Values.ssh.knownHosts | nindent 4 }}
  {{- end }}
